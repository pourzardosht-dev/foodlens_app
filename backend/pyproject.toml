[project]
name = "foodlens-backend"
version = "0.1.0"
description = "FoodLens API and nutrition engine"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.3,<13.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: requires a migrated PostgreSQL database in TEST_DATABASE_URL",
]
