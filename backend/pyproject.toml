[project]
name = "foodlens-backend"
version = "0.1.0"
description = "FoodLens API and nutrition engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.3,<13.0",
    "pydantic>=2.11,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
