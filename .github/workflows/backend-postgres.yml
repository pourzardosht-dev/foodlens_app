name: Backend and PostgreSQL

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: foodlens_test
          POSTGRES_USER: foodlens
          POSTGRES_PASSWORD: foodlens_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodlens -d foodlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -q --ignore=tests/test_postgres_integration.py
      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://foodlens:foodlens_test_password@127.0.0.1:5432/foodlens_test
        run: alembic upgrade head
      - name: Run PostgreSQL integration test
        working-directory: backend
        env:
          APP_ENV: production
          DATABASE_URL: postgresql+psycopg://foodlens:foodlens_test_password@127.0.0.1:5432/foodlens_test
          TEST_DATABASE_URL: postgresql+psycopg://foodlens:foodlens_test_password@127.0.0.1:5432/foodlens_test
          TOKEN_PEPPER: ci-only-token-pepper
        run: python -m pytest tests/test_postgres_integration.py -q